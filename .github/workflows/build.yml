name: build

on:
  workflow_dispatch:
    inputs:
      susfs:
        description: "integrate susfs"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            python3 python-is-python3 lz4 zip unzip cpio rsync ccache \
            device-tree-compiler curl git

      - name: Download kernel source (release asset src)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download src -R "${{ github.repository }}" -p Kernel.tar.gz
          mkdir -p work && tar xzf Kernel.tar.gz -C work && rm -f Kernel.tar.gz
          echo "KP=$GITHUB_WORKSPACE/work/kernel_platform" >> "$GITHUB_ENV"
          sed -n '1,4p' work/kernel_platform/common/Makefile

      - name: Fetch clang-r416183b (uname-aligned)
        run: |
          set -e
          cd "$KP"
          DST="prebuilts-master/clang/host/linux-x86/clang-r416183b"
          mkdir -p "$DST"
          curl -L --retry 5 -o clang.tgz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz"
          tar xzf clang.tgz -C "$DST"
          rm -f clang.tgz
          echo "PATH=$KP/$DST/bin:$PATH" >> "$GITHUB_ENV"
          "$DST/bin/clang" --version | head -1

      - name: Integrate ReSukiSU + SUSFS
        run: |
          set -x
          cd "$KP"
          curl -LSs "https://raw.githubusercontent.com/YuzakiKokuban/ReSukiSU/main/kernel/setup.sh" | bash
          echo "--- ksu driver linked? ---"; ls -la common/drivers/kernelsu 2>/dev/null || echo "NO KSU DRIVER"
          grep -n kernelsu common/drivers/Makefile common/drivers/Kconfig || true
          if [ "${{ inputs.susfs }}" = "true" ]; then
            git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu.git -b gki-android12-5.10 susfs4ksu
            cd common
            cp -v ../susfs4ksu/kernel_patches/fs/*.c fs/ 2>/dev/null || true
            cp -v ../susfs4ksu/kernel_patches/include/linux/*.h include/linux/ 2>/dev/null || true
            patch -p1 --forward --fuzz=3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android12-5.10.patch \
              || echo "WARN: susfs base patch had rejects"
            python3 "$GITHUB_WORKSPACE/patches/fix_namespace.py" fs/namespace.c
          else
            echo "susfs SKIPPED (KSU-only)"
          fi

      - name: Build (raw make, clang-r416183b)
        env:
          KBUILD_BUILD_USER: build-user
          KBUILD_BUILD_HOST: build-host
          KBUILD_BUILD_TIMESTAMP: "Thu Jan  8 08:21:45 UTC 2026"
        run: |
          set -x
          cd "$KP/common"
          MK="make -j$(nproc) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-"
          $MK gki_defconfig
          SUSFS_CFG=""
          [ "${{ inputs.susfs }}" = "true" ] && SUSFS_CFG="-e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS -e KSU_SUSFS_SPOOF_PROC_CMDLINE -e KSU_SUSFS_OPEN_REDIRECT"
          ./scripts/config --file out/.config -e KSU $SUSFS_CFG \
            -d SECURITY_DEFEX -d PROCA -d PROCA_GKI_10 -d FIVE -d FIVE_GKI_10 -d LOCALVERSION_AUTO || true
          $MK olddefconfig
          echo "--- effective KSU/DEFEX/SUSFS ---"; grep -E "CONFIG_KSU|DEFEX|SUSFS|LOCALVERSION_AUTO" out/.config | head -30
          $MK Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          echo "--- boot out ---"; ls -la out/arch/arm64/boot/ 2>/dev/null || true

      - name: Verify + publish Image to release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMG="$KP/common/out/arch/arm64/boot/Image"
          if [ -f "$IMG" ]; then
            echo "=== BUILT uname ==="; strings "$IMG" | grep -m1 "Linux version" || true
            gh release view out -R "${{ github.repository }}" >/dev/null 2>&1 || \
              gh release create out -R "${{ github.repository }}" -t "kernel Image" -n "b4q IZA1 self-built Image"
            cp "$IMG" Image
            gh release upload out Image -R "${{ github.repository }}" --clobber
            echo "OK: Image published to release 'out'"
          else
            echo "NO IMAGE — build failed. Tail of build.log:"
            tail -80 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || true
            exit 1
          fi
